name: CI-CD Lacrei Saude

on:
  push:
    branches:
      - main
      - develop

jobs:
  ci-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm install

      - name: Corrigir permissões dos binários
        run: chmod -R +x node_modules/.bin

      - name: Rodar Lint
        run: ./node_modules/.bin/eslint .

      - name: Rodar Testes
        run: npm test

  deploy:
    needs: ci-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push (Estratégia de Rollback)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/lacrei-api:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/lacrei-api:latest

      - name: Definir IP do Ambiente
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "TARGET_IP=${{ secrets.PRODUCTION_IP }}" >> $GITHUB_ENV
          else
            echo "TARGET_IP=${{ secrets.STAGING_IP }}" >> $GITHUB_ENV
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.TARGET_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/app
            export IMAGE_TAG=${{ github.sha }}
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            docker pull $DOCKER_USERNAME/lacrei-api:$IMAGE_TAG
            docker-compose up -d --force-recreate